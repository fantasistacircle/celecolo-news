# 世界ランキング: Cloudflare Pages の受け取り口（celecolo-rank.pages.dev）の一覧を ranking.txt に写す。
# ワールド（VRChat）は github.io しか読めないので、ここを通して読ませる。中身が変わった時だけコミットする。
name: ranking
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: ranking
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        id: fetch
        run: |
          set -e
          curl -fsS --max-time 30 --retry 2 -o /tmp/ranking.txt "https://celecolo-rank.pages.dev/api/ranking.txt"
          head -n 1 /tmp/ranking.txt | grep -qx "celecolo-rank 1"
          if cmp -s /tmp/ranking.txt ranking.txt; then echo "changed=0" >> "$GITHUB_OUTPUT"; else cp /tmp/ranking.txt ranking.txt; echo "changed=1" >> "$GITHUB_OUTPUT"; fi
      - name: push
        if: steps.fetch.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking.txt
          git commit -m "世界ランキングを更新"
          ok=0; for i in 1 2 3; do if git pull --rebase -q && git push -q; then ok=1; break; fi; sleep 5; done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || echo "pages build request skipped"
